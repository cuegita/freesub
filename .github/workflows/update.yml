name: Update Subscriptions

on:
  schedule:
    # 每 6 小时一轮: UTC 00:23 / 06:23 / 12:23 / 18:23
    #   = 北京时间 08:23 / 14:23 / 20:23 / 02:23
    #   分钟数取 23 而非 00: GitHub 整点是调度高峰, 定时任务会被排队延迟甚至丢弃
    # ⚠️ 本仓库是 fork (parent: hezhanleiok/freesub)。GitHub 对 fork 默认禁用定时任务,
    #    加完这段 cron 后必须去 Actions → 本 workflow → "Enable workflow" 手动开启一次,
    #    否则永远不会有 event=schedule 的运行记录。
    - cron: "23 0,6,12,18 * * *"
  workflow_dispatch:  # 保留手动触发按钮

jobs:
  build:
    runs-on: ubuntu-latest
    # ★ 单跑批串行化: 禁止两轮重叠。
    #   实测 (2026-10-30): 手动 run#2 (19:00-19:44) 与定时任务 run#3 (19:13-19:58) 重叠并发,
    #   两轮各自跑满 ~43 分钟, 结果 run#3 在 push 时被拒:
    #     ! [rejected] main -> main (fetch first)
    #     hint: Updates were rejected because the remote contains work that you do not have locally
    #   → 43 分钟的活儿全废, 还白白多耗一轮 runner。
    #   cancel-in-progress: false = 新的一轮排队等待, 不打断正在跑的那轮
    #   (已在跑的那轮已有大量测活成果, 打断等于浪费)
    concurrency:
      group: freesub-update
      cancel-in-progress: false
    # ★ 原为 50 分钟。候选池规模随订阅源波动, 单次跑满 45 分钟仍未完成的情况已实际发生过;
    #   被中断时后续 commit/push 永不执行, 整轮一个节点都发不出去。
    #   改为 180 分钟 (远低于公共仓库单 job 6 小时上限), 并让 main_v2.py 自带
    #   MAX_RUNTIME_SEC=6600s (110 分钟) 的内部预算 —— 正常情况下自己会提前收敛并发布,
    #   这里的 180 分钟只是兜住最后一道。
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Prepare runtime (sing-box 内核 + GeoLite 数据库)
        # ★ 必须排在单元测试之前: 单测阶段2 要用 sing-box 校验配置合法性。
        #   旧流水线没有这一步, 而 runtime/ 由 main_v2.setup_environment() 在线下载且被
        #   .gitignore 排除 —— 单测跑在 main 之前时内核根本不存在, Linux 上又硬编码 .exe
        #   后缀 → FileNotFoundError → 单测步骤失败 → 整轮不发布。
        #   这里提前下载后, main_v2 启动时会检测到已存在而直接复用, 不额外耗时。
        run: |
          python -c "import sys; sys.path.insert(0,'scripts'); import main_v2; main_v2.setup_environment()"

      - name: Run Unit Tests (解析器 / 配置合法性 / 分类)
        # CHANGES.md 里 #3~#7 全是"导出丢参数"类回归, 解析器最容易坏且坏得最隐蔽
        run: |
          python scripts/test_parsers.py

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          # 便于 ip-api 等识别限速; GitHub runner 出口为美国 Azure
          PYTHONUNBUFFERED: '1'

      - name: Upload run report (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        # ★ always(): 探活步骤一旦失败/被中断, 后续步骤就永远不执行 → 整轮零产出。
        #   即使这轮没跑完, 也应先把手上已有的结果发布出去, 而不是白跑一次
        #   (output 无变化时 git 会判定无 diff 自动跳过, 不会写空订阅)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            # ★ 推送前必须重新对齐远端 —— 本轮 checkout 之后, main 可能已被其他提交推进
            #   (实测 2026-10-30 那轮就是这么被拒的:
            #      ! [rejected] main -> main (fetch first)
            #      hint: Updates were rejected because the remote contains work that you do not have locally
            #    跑批期间有人往 main 推了提交, 45 分钟的活儿全部作废)。
            #  fetch + reset --soft: 把本轮产出原样挪到远端最新之上, 保证一定 fast-forward。
            #  output/ 与 README 都是本轮整轮重新生成的, 以本轮为准, 不会覆盖丢远端别人的改动。
            #  仍失败则重试 3 次 (并发推送时退避重试即可)。
            for i in 1 2 3; do
              git fetch origin main
              git reset --soft origin/main
              git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
              if git push; then
                echo "[+] 推送成功 (第 $i 次尝试)"
                break
              fi
              echo "[!] 第 $i 次推送被拒 (远端又有新提交), 5s 后重试 ..."
              sleep 5
            done
          fi

      - name: Purge jsDelivr CDN (post-push)
        if: always()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          p() { curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@main/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json residential.txt residential-clash.yaml residential-singbox.json; do
            p "output/$f"
          done
          find output/residential-by-country output/by-country -type f 2>/dev/null | while read -r f; do
            p "$f"; sleep 0.2
          done
          echo "[+] jsDelivr CDN purge done (after push)"
